[package]
name = "prismaboard"
version = "0.2.0"
description = "PrismaBoard - διαδραστικός πίνακας"
edition = "2021"

[lib]
name = "prismaboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# το tauri::generate_context! τη χρειάζεται όταν το tauri.conf.json έχει ενότητα plugins (updater)
serde_json = "1"
xcap = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
