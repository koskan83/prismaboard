[package]
name = "prismaboard"
version = "0.2.4"
description = "PrismaBoard - διαδραστικός πίνακας"
edition = "2021"

[lib]
name = "prismaboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# το tauri::generate_context! τη χρειάζεται όταν το tauri.conf.json έχει ενότητα plugins (updater)
serde_json = "1"
xcap = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
# σύνδεση με το Google Drive (google.rs): τα reqwest, rustls και tokio υπάρχουν ήδη μέσω του updater
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["net", "time", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
