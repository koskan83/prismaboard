name: Windows installer

# Σε κάθε tag v* (π.χ. v0.2.0): χτίζει το πρόγραμμα εγκατάστασης, το υπογράφει για την αυτόματη ενημέρωση
# και το ανεβάζει σε GitHub Release μαζί με το latest.json, που το διαβάζουν τα εγκατεστημένα προγράμματα
# (βλ. plugins.updater στο src-tauri/tauri.conf.json).
# Χειροκίνητα από την καρτέλα Actions: μόνο χτίσιμο, χωρίς release (το .exe κατεβαίνει από τα Artifacts).
#
# Χρειάζονται τα secrets του αποθετηρίου TAURI_SIGNING_PRIVATE_KEY και TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# (το κλειδί από το «tauri signer generate»). Χωρίς αυτά το χτίσιμο αποτυγχάνει.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # τα ίδια σενάρια με το pages.yml: αν κάποιο αποτύχει, δεν φτάνει ενημέρωση σε κανέναν υπολογιστή
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tests/e2e/run.mjs

  build:
    needs: e2e
    runs-on: windows-latest
    # για το GitHub Release
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # το tag πρέπει να είναι ίδιο με την έκδοση του package.json, αλλιώς τα προγράμματα δεν θα έβλεπαν σωστά τη νέα έκδοση
      - name: Έλεγχος έκδοσης
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "::error::Το tag ${GITHUB_REF_NAME} δεν ταιριάζει με την έκδοση $want του package.json"; exit 1; }
      - name: Έλεγχος κλειδιού υπογραφής
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::Λείπει το secret TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          [ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ] || echo "::warning::Το secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD είναι κενό"
      # οι τελευταίες γραμμές ενός σφάλματος γράφονται και ως annotations, που φαίνονται και χωρίς σύνδεση στο GitHub
      # το κλειδί υπογραφής μόνο στα βήματα που το χρειάζονται: όχι στο npm ci, στα tests και στα actions τρίτων
      - name: Χτίσιμο
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          npx tauri build --ci 2>&1 | tee build.log || {
            # μία annotation με όλες τις γραμμές (το GitHub κρατά το πολύ 10 ανά βήμα)
            echo "::error::$(grep -v '^\s*Compiling ' build.log | tail -n 40 | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Release και latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/nsis
          exe=$(ls *-setup.exe | head -1)
          [ -f "$exe.sig" ] || { echo "::error::Λείπει η υπογραφή $exe.sig"; exit 1; }
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${exe// /.}"
          node -e '
            const [ver, url, sig] = process.argv.slice(1);
            const p = { signature: sig, url };
            require("fs").writeFileSync("latest.json", JSON.stringify({
              version: ver, notes: "PrismaBoard " + ver, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": p, "windows-x86_64-nsis": p },
            }, null, 2));
          ' "${GITHUB_REF_NAME#v}" "$url" "$(cat "$exe.sig")"
          gh release create "$GITHUB_REF_NAME" "$exe" "$exe.sig" latest.json \
            --title "PrismaBoard $GITHUB_REF_NAME" \
            --notes "Πρόγραμμα εγκατάστασης για Windows. Τα προγράμματα που είναι ήδη εγκατεστημένα ενημερώνονται μόνα τους." \
            --latest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prismaboard-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
