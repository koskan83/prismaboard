name: Web app (beta και κυκλοφορία)

# Δύο κανάλια:
#  - push στο main → beta.prismaboard.klabs.gr (Cloudflare Pages, έργο prismaboard-beta), με ένδειξη «BETA».
#    Εκεί δοκιμάζεται κάθε αλλαγή πριν φτάσει στους δασκάλους.
#  - tag v* (π.χ. v0.2.1) → κυκλοφορία: prismaboard.klabs.gr (Cloudflare Pages, έργο prismaboard)
#    και η παλιά διεύθυνση koskan83.github.io/prismaboard (GitHub Pages), που μένει για τη μεταφορά των μαθημάτων (βλ. src/move.ts).
#    Το ίδιο tag βγάζει και το πρόγραμμα για Windows (windows.yml).
# Για το Cloudflare χρειάζονται τα secrets CLOUDFLARE_API_TOKEN (δικαίωμα «Cloudflare Pages: Edit») και CLOUDFLARE_ACCOUNT_ID.
# Για το GitHub Pages από tag: Settings → Environments → github-pages → να επιτρέπονται τα tags v*.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

# μόνο ανάγνωση εκτός αν ένα job ζητά κάτι παραπάνω (το release, για το GitHub Pages)
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      VITE_CHANNEL: beta
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # σενάρια που πατάνε κουμπιά στην χτισμένη εφαρμογή· αν κάποιο αποτύχει, η έκδοση δεν δημοσιεύεται
      - run: node tests/e2e/run.mjs
      # το έργο φτιάχνεται την πρώτη φορά· αν υπάρχει ήδη, η εντολή αποτυγχάνει χωρίς πρόβλημα
      - name: Cloudflare Pages – έργο beta
        continue-on-error: true
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create prismaboard-beta --production-branch=main
      - name: Cloudflare Pages – δημοσίευση beta
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=prismaboard-beta --branch=main

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      # το tag πρέπει να είναι ίδιο με την έκδοση του package.json
      - name: Έλεγχος έκδοσης
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$want" = "${GITHUB_REF_NAME}" ] || { echo "::error::Το tag ${GITHUB_REF_NAME} δεν ταιριάζει με την έκδοση $want του package.json"; exit 1; }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node tests/e2e/run.mjs
      - name: Cloudflare Pages – δημοσίευση
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=prismaboard --branch=main
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
