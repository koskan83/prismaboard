name: Android (Google Play)

# Η εφαρμογή Android του Google Play (Capacitor, φάκελος android/): όλα τα αρχεία της μέσα στο πακέτο.
#  - tag v* (μαζί με το site και τα Windows): κυκλοφορία, το .aab για το Play Console και ένα .apk για δοκιμή σε tablet ή πίνακα.
#    Δεν ανεβαίνει μόνο του στο Play: η κυκλοφορία στην παραγωγή γίνεται με το χέρι στο Play Console.
#  - push στο main (εκτός αν αλλάζουν μόνο docs/, examples/ ή .md): beta (VITE_CHANNEL=beta, όπως το beta.prismaboard.klabs.gr)
#    και, αν υπάρχει το secret PLAY_SERVICE_ACCOUNT_JSON, ανέβασμα στο κανάλι «Εσωτερική δοκιμή» (internal) του Play.
#    Βλ. docs/play-store.md, «Κανάλι δοκιμών (Εσωτερική δοκιμή)».
#
# Έκδοση (versionCode = ο αριθμός που κοιτάζει το Play· πρέπει να ανεβαίνει πάντα και να μην ξαναχρησιμοποιείται):
#  - κυκλοφορία: versionName από το package.json, versionCode = (major·10000 + minor·100 + patch)·100, π.χ. 0.2.5 → 20500.
#    (Παλιό σχήμα χωρίς το ·100: 0.2.4 → 204. Το νέο είναι πάντα μεγαλύτερο, άρα το Play το δέχεται.)
#  - beta: versionCode = κωδικός κυκλοφορίας του τελευταίου tag v* + N, όπου N = commits μετά από αυτό το tag (έως 99),
#    π.χ. 11 commits μετά το v0.2.4 → 20411, versionName 0.2.4-beta.11.
#    Βάση είναι το tag και όχι το package.json: το commit «Έκδοση 0.2.5» έχει ήδη 0.2.5 στο package.json πριν μπει το tag·
#    αν μετρούσαμε από εκεί, η beta του θα έπαιρνε 20501 και η κυκλοφορία 0.2.5 (20500) θα έμενε πιο κάτω από τη beta.
#
# Υπογραφή με το «κλειδί ανεβάσματος» του Play (όχι το κλειδί του ψαλιδιού), από τα secrets:
#   ANDROID_KEYSTORE_B64 (το .jks/.p12 σε base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (αν διαφέρει).
# Χωρίς αυτά βγαίνει ανυπόγραφο πακέτο, που δεν ανεβαίνει στο Play.
# Ανέβασμα στην Εσωτερική δοκιμή: PLAY_SERVICE_ACCOUNT_JSON (το κλειδί JSON του service account του Google Cloud).

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    # τα φίλτρα διαδρομών δεν ισχύουν για τα tags: η κυκλοφορία χτίζεται πάντα
    paths-ignore: ['docs/**', 'examples/**', '**.md']

permissions:
  contents: read

# μία beta τη φορά, με τη σειρά των push (η πιο καινούργια ακυρώνει την παλιότερη που περιμένει ή τρέχει)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # όλο το ιστορικό και τα tags, για το N της beta
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      # το Android SDK υπάρχει ήδη στο ubuntu-latest (ANDROID_HOME)· ό,τι λείπει το κατεβάζει το Gradle
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: npm ci
      - run: npm test
      - name: Έκδοση
        run: |
          ver=$(node -p "require('./package.json').version")
          # κωδικός κυκλοφορίας: (major·10000 + minor·100 + patch)·100
          relcode() { node -p "const [a,b,c]='$1'.split('.').map(Number); (a*10000+b*100+c)*100"; }
          if [[ "$IS_RELEASE" == true ]]; then
            if [[ "v$ver" != "$GITHUB_REF_NAME" ]]; then
              echo "::error::Το tag $GITHUB_REF_NAME δεν ταιριάζει με την έκδοση $ver του package.json"; exit 1
            fi
            name="$ver"; code=$(relcode "$ver"); upload=false
          else
            # beta: κωδικός του τελευταίου tag v* + N commits μετά από αυτό
            if tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null); then
              base="${tag#v}"; n=$(git rev-list --count "$tag..HEAD")
            else
              base="$ver"; n=$(git rev-list --count HEAD)
            fi
            upload=true
            # Όριο 99: πάνω από αυτό το N θα «έτρωγε» τον κωδικό της επόμενης κυκλοφορίας (20499 + 1 = 20500 = 0.2.5).
            # Το τίμημα: μετά από 99 commits χωρίς κυκλοφορία όλες οι beta παίρνουν τον ίδιο κωδικό, που το Play δεν
            # δέχεται δεύτερη φορά· τότε χτίζουμε χωρίς ανέβασμα μέχρι να βγει νέο tag v*.
            if (( n > 99 )); then
              echo "::warning::$n commits μετά το ${tag:-αρχή}: ο κωδικός μένει στο +99 και η beta δεν ανεβαίνει στο Play. Βγάλτε νέα κυκλοφορία (tag v*)."
              n=99; upload=false
            fi
            # N = 0: το commit είναι το ίδιο το tag, που έχει ήδη τον κωδικό της κυκλοφορίας
            if (( n == 0 )); then
              echo "::notice::Το commit είναι η κυκλοφορία $tag· η beta δεν ανεβαίνει (ίδιος versionCode με την κυκλοφορία)."
              upload=false
            fi
            name="$ver-beta.$n"; code=$(( $(relcode "$base") + n ))
            echo "VITE_CHANNEL=beta" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=$ver beta (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          fi
          echo "versionName $name, versionCode $code"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "UPLOAD=$upload" >> "$GITHUB_ENV"
      # χτίσιμο της εφαρμογής (beta: με VITE_CHANNEL=beta από το προηγούμενο βήμα) και αντιγραφή του dist/ μέσα στο android/
      - run: npx vite build && npx cap sync android
      - name: Κλειδί υπογραφής
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Χτίσιμο (.aab για το Play, .apk για δοκιμή)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          # τα σφάλματα του Gradle γράφονται και ως annotation, που φαίνεται και χωρίς σύνδεση στο GitHub
          ./gradlew --no-daemon bundleRelease assembleRelease 2>&1 | tee build.log || {
            echo "::error::$(grep -E -A12 'error:|What went wrong|FAILURE|e: ' build.log | head -n 45 | cut -c1-300 | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
          mkdir -p ../out
          cp app/build/outputs/bundle/release/*.aab "../out/PrismaBoard-$VERSION_NAME.aab"
          cp app/build/outputs/apk/release/*.apk "../out/PrismaBoard-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prismaboard-android-${{ env.VERSION_NAME }}
          path: out/*
      # ---------- beta → Play, κανάλι «Εσωτερική δοκιμή» ----------
      - name: Χωρίς ανέβασμα στο Play
        if: env.IS_RELEASE != 'true' && env.UPLOAD == 'true' && (env.HAS_PLAY != 'true' || env.HAS_KEY != 'true' || github.ref != 'refs/heads/main')
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::notice::Η beta ανεβαίνει στο Play μόνο από το main (τώρα: $GITHUB_REF_NAME). Το .aab είναι στα artifacts."
          elif [[ "$HAS_KEY" != true ]]; then
            echo "::notice::Λείπει το κλειδί υπογραφής (ANDROID_KEYSTORE_B64 κ.λπ.): ανυπόγραφο .aab, δεν ανεβαίνει στο Play."
          else
            echo "::notice::Η beta χτίστηκε αλλά δεν ανέβηκε στο Play: προσθέστε το secret PLAY_SERVICE_ACCOUNT_JSON (Settings → Secrets and variables → Actions), το κλειδί JSON του service account με άδεια κυκλοφορίας στο Play Console. Βλ. docs/play-store.md, «Κανάλι δοκιμών (Εσωτερική δοκιμή)»."
          fi
      - name: Ανέβασμα στην Εσωτερική δοκιμή του Play
        if: env.IS_RELEASE != 'true' && env.UPLOAD == 'true' && env.HAS_PLAY == 'true' && env.HAS_KEY == 'true' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: gr.klabs.prismaboard
          releaseFiles: out/PrismaBoard-${{ env.VERSION_NAME }}.aab
          releaseName: ${{ env.RELEASE_NAME }}
          track: internal
          status: completed
